services:
  postgres:
    image: postgres:16-alpine
    container_name: fup-postgres
    restart: unless-stopped          # 추가
    environment:
      POSTGRES_DB: fileuploadpolicy
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d fileuploadpolicy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fup-backend
    restart: unless-stopped          # 추가
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fileuploadpolicy
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      UPLOAD_STORAGE_PATH: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fup-frontend
    restart: unless-stopped          # 추가
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata: